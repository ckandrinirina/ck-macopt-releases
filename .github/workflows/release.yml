# ck-macopt release pipeline. Lives in the private ck-macopt repo (scripts/release/public/) and is
# copied to the public ck-macopt-releases repo by scripts/release/sync_public.py, where Actions
# minutes are free. It checks the private source out at the tag with the SOURCE_DEPLOY_KEY deploy key and publishes
# into this repo: the GitHub release plus latest.json on gh-pages.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of ckandrinirina/ck-macopt to release, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASES_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}
  SIGN_NAME: ck-macopt Signing

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ckandrinirina/ck-macopt
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      # Stops here, before anything is built, if the tag and VERSION disagree.
      - name: Check the tag matches VERSION
        run: python3 scripts/release/manifest.py --check-tag "$TAG"

      - name: Test
        run: make test

      # A temporary keychain holds the shared self-signed identity so every release keeps the
      # certificate the installed helper trusts. It is deleted at the end, pass or fail.
      - name: Import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/ck-macopt-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"

          # codesign only signs with an identity trusted for code signing.
          security find-certificate -c "$SIGN_NAME" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign "$RUNNER_TEMP/signing.pem" ||
            echo "::warning::could not trust the certificate for code signing"
          sha1="$(/usr/bin/openssl x509 -in "$RUNNER_TEMP/signing.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')"
          echo "SIGNING_SHA1=$sha1" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build the universal binaries
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          for binary in ck-macopt ck-macopt-helper; do
            info="$(lipo -info "$bin/$binary")"
            echo "$info"
            case "$info" in *x86_64*) ;; *) echo "$binary has no x86_64 slice" >&2; exit 1 ;; esac
            case "$info" in *arm64*) ;; *) echo "$binary has no arm64 slice" >&2; exit 1 ;; esac
          done

      - name: Assemble and sign the app
        run: |
          UNIVERSAL=1 scripts/bundle.sh
          # bundle.sh falls back to ad-hoc when the identity is unusable: that must fail a release.
          requirement="$(codesign -dr - build/ck-macopt.app 2>&1)"
          echo "$requirement"
          case "$requirement" in
            *"certificate leaf = H\"$SIGNING_SHA1\""*) ;;
            *) echo "The app is not signed with $SIGN_NAME ($SIGNING_SHA1)" >&2; exit 1 ;;
          esac

      # Opens the built app (fixture data, no hardware) and fails if it dies within seconds.
      - name: Launch smoke test
        run: |
          CK_MACOPT_FIXTURES=1 build/ck-macopt.app/Contents/MacOS/ck-macopt > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "ck-macopt exited within 10 s:" >&2
            cat "$RUNNER_TEMP/smoke.log" >&2
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Zip
        run: ZIP_NAME=ck-macopt-macOS.zip OUT_DIR=dist scripts/dist.sh

      # A draft first, so a failure after this point never leaves a half-published release.
      - name: Draft the release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$RELEASES_REPO" --draft \
              --title "ck-macopt ${TAG#v}" \
              --notes "ck-macopt ${TAG#v} for macOS. Installed copies update themselves."
          gh release upload "$TAG" dist/ck-macopt-macOS.zip --repo "$RELEASES_REPO" --clobber

      - name: Write latest.json
        run: |
          python3 scripts/release/manifest.py --version "${TAG#v}" --zip dist/ck-macopt-macOS.zip \
            --base-url "https://github.com/$RELEASES_REPO/releases/download/$TAG" --out dist/latest.json
          cat dist/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/latest.json --repo "$RELEASES_REPO" --clobber
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --latest

      # The release is public: the updater reads this file from the site.
      - name: Publish latest.json to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git"
          pages="$RUNNER_TEMP/pages"
          if ! git clone -q --depth 1 --branch gh-pages "$remote" "$pages" 2>/dev/null; then
            mkdir "$pages"
            git -C "$pages" init -q -b gh-pages
            git -C "$pages" remote add origin "$remote"
          fi
          cp dist/latest.json "$pages/latest.json"
          touch "$pages/.nojekyll"
          cd "$pages"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already has this latest.json"
          else
            git -c user.name=ck-macopt-release -c user.email=release@users.noreply.github.com \
              commit -q -m "Publish latest.json for $TAG"
            git push -q origin gh-pages
          fi
          gh api "repos/$RELEASES_REPO/pages" >/dev/null 2>&1 ||
            gh api -X POST "repos/$RELEASES_REPO/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null ||
            echo "::warning::GitHub Pages is not on: enable it once (Settings > Pages > gh-pages, folder /)"

      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"
